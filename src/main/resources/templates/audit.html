<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Audit events · V-GRT Secure Cloud</title><link rel="stylesheet" th:href="@{/app.css}"></head>
<body><header class="topbar"><a class="brand" th:href="@{/}"><span class="brand-mark">V</span><span>V-GRT <small>SECURE CLOUD</small></span></a><nav><a th:href="@{/}">My files</a><form th:action="@{/logout}" method="post"><button class="link-button">Sign out</button></form></nav></header>
<main class="container"><section class="welcome"><div><p class="eyebrow">ADMINISTRATOR VIEW</p><h1>Audit events</h1><p class="muted">Latest 100 authentication and file activity events.</p></div></section>
<div class="panel table-wrap"><table><thead><tr><th>Time (UTC)</th><th>Actor</th><th>Event</th><th>Resource</th><th>Outcome</th><th>Details</th></tr></thead><tbody><tr th:each="event : ${events}"><td th:text="${event.occurredAt}"></td><td th:text="${event.actorUsername ?: 'anonymous'}"></td><td th:text="${event.eventType}"></td><td th:text="${event.resourceId ?: '—'}"></td><td><span class="status" th:classappend="${event.outcome == 'SUCCESS'} ? ' ok' : ' bad'" th:text="${event.outcome}"></span></td><td th:text="${event.details}"></td></tr><tr th:if="${#lists.isEmpty(events)}"><td colspan="6" class="muted">No recorded events.</td></tr></tbody></table></div></main></body></html>
