<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · V-GRT Secure Cloud</title>
  
  <script>
    (function() {
      var saved = localStorage.getItem('vgrt_theme_preference');
      var theme = saved || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <link rel="stylesheet" th:href="@{/app.css}">
  <script defer th:src="@{/app.js}"></script>
</head>
<body class="auth-viewport">

  <div style="position: absolute; top: 20px; right: 24px;">
    <button type="button" class="theme-toggle-btn" aria-label="Toggle monochrome color theme">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    </button>
  </div>

  <main class="auth-box card card-interactive">
    <div class="auth-header">
      <div class="brand-glyph">V</div>
      <div class="eyebrow">TENANT REGISTRATION</div>
      <h1>Create account</h1>
      <p class="text-sm text-muted">Generate your private cryptographic partition.</p>
    </div>

    <!-- Errors -->
    <div class="notice error" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>

    <!-- Registration Form -->
    <form th:action="@{/register}" th:object="${registration}" method="post" class="auth-form">
      <div class="form-group">
        <label for="username" class="form-label">
          <span>Username</span>
          <span class="form-hint">3–40 characters</span>
        </label>
        <input class="input-text" id="username" th:field="*{username}" autocomplete="username" required minlength="3" maxlength="40" placeholder="e.g. alex.chen" autofocus>
        <small class="text-xs" style="color: var(--state-danger-text);" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></small>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">
          <span>Master Password</span>
          <span class="form-hint">12–72 characters</span>
        </label>
        <input class="input-text" id="password" th:field="*{password}" type="password" autocomplete="new-password" required minlength="12" maxlength="72" placeholder="Minimum 12 characters">
        <small class="text-xs" style="color: var(--state-danger-text);" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>
      </div>

      <button class="btn btn-primary btn-lg" type="submit" style="margin-top: 6px; width: 100%;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        Register & Initialize Vault
      </button>
    </form>

    <div style="border-top: 1px solid var(--border-subtle); padding-top: 18px; text-align: center;">
      <p class="text-sm text-secondary">
        Already have a vault? <a th:href="@{/login}" style="color: var(--text-primary); font-weight: 600; text-decoration: underline;">Sign in</a>
      </p>
    </div>
  </main>

  <footer style="margin-top: 24px; text-align: center; color: var(--text-muted); font-size: 0.75rem;">
    V-GRT Secure Cloud · Virtualization • Governance • Trustworthy Security
  </footer>

</body>
</html>
