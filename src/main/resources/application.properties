spring.application.name=cloud-data-security-vgrt
server.port=${PORT:8081}
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${DB_URL:jdbc:h2:mem:vgrt_securecloud;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
vgrt.storage.root=${VGRT_STORAGE_ROOT:./data/objects}
vgrt.crypto.public-key=${VGRT_RSA_PUBLIC_KEY:}
vgrt.crypto.private-key=${VGRT_RSA_PRIVATE_KEY:}
logging.level.org.springframework.security=INFO
